# nginx site for yozhan. Drop into /etc/nginx/sites-available/yozhan,
# symlink into sites-enabled, then get a certificate:
#
#   sudo ln -s /etc/nginx/sites-available/yozhan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yozhan.rkshanu.cloud
#
# certbot rewrites this file to add the TLS block and an HTTP->HTTPS redirect.
#
# Once this is in place, STOP publishing the gateway port to the world. In your
# Portainer stack, bind it to loopback only:
#
#   ports:
#     - "127.0.0.1:3030:3000"
#
# Otherwise http://host:3030 stays reachable and bypasses everything below —
# including TLS.

server {
    listen 80;
    listen [::]:80;
    server_name yozhan.rkshanu.cloud;

    # Uploads and long agent replies; the default 1m is tight for a chat body.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;

        # X-Forwarded-Proto is what tells the gateway the original request was
        # HTTPS, which is what makes it set the Secure flag on the session
        # cookie. Without it, the cookie is issued without Secure and a browser
        # will happily send it over plain HTTP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Agent replies can take a while on CPU-only local inference.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # Streaming responses shouldn't be held in a buffer.
        proxy_buffering off;

        # WebSocket upgrade, for when the dashboard grows live updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # A few headers worth having on an admin panel. HSTS is deliberately left
    # to certbot's TLS block — sending it over plain HTTP does nothing, and
    # setting it before TLS works can lock you out of your own domain.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY    always;
    add_header Referrer-Policy        no-referrer always;
}
