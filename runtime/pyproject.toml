[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yozhan-runtime"
version = "0.1.0"
description = "yozhan agent runtime: agent loop, skills, memory, model provider router"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# The browser client. Kept optional because it is only useful alongside the
# `browser` compose service, and the runtime image should stay small for
# people who never enable it.
browser = ["playwright>=1.49"]

[project.scripts]
yozhan = "yozhan_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["yozhan_runtime*"]
