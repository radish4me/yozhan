[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yozhan-runtime"
version = "0.1.0"
description = "yozhan agent runtime: agent loop, skills, memory, model provider router"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
yozhan = "yozhan_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["yozhan_runtime*"]
