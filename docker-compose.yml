services:
  llama-server:
    build:
      context: .
      dockerfile: docker/llama.Dockerfile
    environment:
      - LLAMA_CACHE=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_ENDPOINT=${MODEL_ENDPOINT:-}
      - LOCAL_DEFAULT_MODEL=${LOCAL_DEFAULT_MODEL:-qwen3.5-0.8b}
    volumes:
      - llama_cache:/models
    networks: [yozhan_internal]

  runtime:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
    env_file: .env
    environment:
      - LLAMA_SERVER_URL=http://llama-server:8080/v1
      - YOZHAN_DATA_DIR=/app/data
      - YOZHAN_SKILLS_DIR=/app/skills
      - YOZHAN_WORKSPACE_DIR=/app/workspace
    volumes:
      - ./config:/app/config
      - runtime_data:/app/data
      - runtime_workspace:/app/workspace
    depends_on: [llama-server]
    networks: [yozhan_internal]

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    env_file: .env
    environment:
      - RUNTIME_URL=http://runtime:8787
      - PORT=${GATEWAY_PORT:-3000}
      - GATEWAY_DATA_DIR=/app/gateway/data
    volumes:
      - gateway_data:/app/gateway/data
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on: [runtime]
    networks: [yozhan_internal]

volumes:
  llama_cache:
  runtime_data:
  runtime_workspace:
  gateway_data:

networks:
  yozhan_internal:
