# Provider, model, and API-key configuration. See ARCHITECTURE.md section 4.1
# for the full schema explanation. Edit this file directly — no code change
# needed to add a model, add a key, or reorder a fallback chain.

providers:
  local:
    type: llama_cpp
    base_url: http://llama-server:8080/v1
    models:
      - id: qwen3.5-0.8b
        hf: unsloth/Qwen3.5-0.8B-GGUF:Q4_K_M
      - id: lfm2.5
        hf: LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
      - id: agents-a1-4b
        hf: InternScience/Agents-A1-4B-Q4_K_M-GGUF:Q4_K_M
    default_model: ${LOCAL_DEFAULT_MODEL:-qwen3.5-0.8b}

  # A model may be a bare string, or a mapping carrying an optional `pricing`
  # block (USD per million tokens) used by the cost report (`yozhan costs`).
  # A model with no pricing reports cost as unknown rather than as zero.
  anthropic:
    type: anthropic
    api_keys:
      - env: ANTHROPIC_API_KEY_1
      - env: ANTHROPIC_API_KEY_2
    models:
      - id: claude-sonnet-5
        pricing: {input_per_mtok: 3.0, output_per_mtok: 15.0}
      - id: claude-haiku-4-5
        pricing: {input_per_mtok: 1.0, output_per_mtok: 5.0}

  gemini:
    type: gemini
    api_keys:
      - env: GEMINI_API_KEY_1
      - env: GEMINI_API_KEY_2
    models: [gemini-2.5-flash, gemini-2.5-pro]

  openrouter:
    type: openrouter
    api_keys:
      - env: OPENROUTER_API_KEY
    models: [qwen/qwen-2.5-coder, google/gemini-flash-1.5, x-ai/grok-4]

  grok:
    type: grok
    api_keys:
      - env: GROK_API_KEY
    models: [grok-4]

  openai:
    type: openai
    api_keys:
      - env: OPENAI_API_KEY
    models: [gpt-5.1, gpt-5.1-mini]

  # Any other OpenAI-compatible endpoint. Ollama, vLLM and SGLang all expose
  # one, so they work here without a dedicated transport — point base_url at
  # them and list the models they serve.
  #
  # ollama:
  #   type: openai_compatible
  #   base_url: http://ollama:11434/v1
  #   models: [llama3.2, qwen2.5-coder]
  #
  # vllm:
  #   type: openai_compatible
  #   base_url: http://vllm:8000/v1
  #   models: [meta-llama/Llama-3.1-8B-Instruct]
  #
  # custom_vps:
  #   type: openai_compatible
  #   base_url: https://models.example.internal/v1
  #   api_keys:
  #     - env: CUSTOM_VPS_KEY
  #   models: [my-finetune-7b]

# Ordered fallback chains, tried top-to-bottom on error/rate-limit/timeout.
# Referenced by name from config/agents.yaml. `mode: parallel` chains run
# every member concurrently instead of sequentially (multi-model fan-out).
fallback_chains:
  default:
    - {provider: anthropic, model: claude-sonnet-5}
    - {provider: gemini, model: gemini-2.5-flash}
    - {provider: openrouter, model: qwen/qwen-2.5-coder}
    - {provider: local, model: qwen3.5-0.8b}

  local_first:
    - {provider: local, model: qwen3.5-0.8b}
    - {provider: openrouter, model: google/gemini-flash-1.5}

  cheap_parallel_fanout:
    mode: parallel
    members:
      - {provider: openrouter, model: qwen/qwen-2.5-coder}
      - {provider: gemini, model: gemini-2.5-flash}
      - {provider: local, model: qwen3.5-0.8b}
