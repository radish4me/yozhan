# Per-agent and per-sub-agent model assignment. See ARCHITECTURE.md section 4.2.
# Resolution order per agent: explicit {provider, model} pin -> named
# fallback_chain -> defaults.fallback_chain. Sub-agents override independently
# of their parent; nothing cascades unless a child omits its own setting.

defaults:
  fallback_chain: default
  # Sandboxed tool execution (ROADMAP.md Phase 7).
  #   off                  every tool runs in the runtime process
  #   non-privileged-only  sandbox everything except skills marked `elevated: true`
  #   all                  sandbox everything, elevated skills included
  # A sandboxed tool never receives the runtime's environment, so provider API
  # keys are not reachable from skill code.
  sandbox: non-privileged-only
  sandbox_backend: subprocess   # subprocess | docker | podman
  sandbox_timeout_seconds: 30

# Self-improving learning loop (ROADMAP.md Phase 6). After a task that crossed
# the complexity threshold, a reviewer proposes a new skill or a patch to an
# existing one. Proposals are STAGED, never written to disk automatically,
# unless you flip write_approval to false — an agent that silently rewrites its
# own instruction set is very hard to debug and audit.
learning:
  enabled: true
  write_approval: true
  min_tool_calls: 3
  fallback_chain: local_first   # the reviewer itself is a cheap background job

# Agent-to-agent interop (ROADMAP.md Phase 8). Off by default: enabling it
# both exposes this agent to other agents and lets it call out to them.
a2a:
  enabled: false

  # --- inbound: other agents talking to yozhan ---
  # Serves an agent card at /.well-known/agent-card.json and accepts JSON-RPC
  # `message/send` at /a2a. Only skills marked `a2a: true` are advertised.
  require_token: true             # bearer token from the env var below
  token_env: A2A_INBOUND_TOKEN
  agent_name: yozhan
  agent_description: A self-hosted personal AI assistant.
  public_url: http://localhost:8787/a2a

  # --- outbound: yozhan talking to other agents ---
  # Only peers listed here are reachable. There is deliberately no way for the
  # model to supply an arbitrary URL — that would be an SSRF primitive aimed
  # at whatever a prompt names, including your private network.
  peers: []
  # peers:
  #   - name: research-bot
  #     url: https://peer.example.com/a2a
  #     token_env: A2A_PEER_RESEARCH_TOKEN

agents:
  orchestrator:
    fallback_chain: default
    mode: on-demand

  researcher:
    subagent_of: orchestrator
    fallback_chain: local_first
    mode: on-demand

  coder:
    subagent_of: orchestrator
    provider: anthropic
    model: claude-sonnet-5
    mode: on-demand

  reviewer:
    subagent_of: orchestrator
    fallback_chain: cheap_parallel_fanout
    mode: on-demand

  # Agents that aren't driven by a user message. `yozhan scheduler` runs these;
  # both need a `task:` since there's no human turn to supply one.
  digest:
    fallback_chain: local_first
    mode: scheduled
    schedule: "0 8 * * *"          # minute hour day-of-month month day-of-week
    task: "Summarize anything noteworthy from yesterday's sessions."

  # A continuous agent re-runs on a fixed interval instead of a cron schedule.
  # watcher:
  #   fallback_chain: local_first
  #   mode: continuous
  #   interval_seconds: 900
  #   task: "Check the workspace for new files and report anything unexpected."
